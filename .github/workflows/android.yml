name: 构建 Android Lite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: 验证单元测试并构建签名 APK
        env:
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$signingKey" && test -n "$keyAlias" && test -n "$keyStorePassword" && test -n "$keyPassword"
          ./gradlew :app:testLiteDebugUnitTest :app:assembleLiteRelease \
            -Papp.versionCode="$GITHUB_RUN_NUMBER" -Papp.versionName="0.1.$GITHUB_RUN_NUMBER" \
            --no-configuration-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process
      - name: 校验并收集 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "dist/zhihu-eink-lite-0.1.$GITHUB_RUN_NUMBER.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs dist/*.apk
          cp app/build/outputs/mapping/liteRelease/mapping.txt dist/mapping.txt
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zhihu-eink-lite
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
          if-no-files-found: ignore
