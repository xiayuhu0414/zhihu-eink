name: 构建并发布 Android Lite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: 验证发布脚本
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: 验证单元测试并构建签名 APK
        env:
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$signingKey" && test -n "$keyAlias" && test -n "$keyStorePassword" && test -n "$keyPassword"
          ./gradlew :app:testLiteDebugUnitTest :app:assembleLiteRelease \
            -Papp.versionCode="$GITHUB_RUN_NUMBER" -Papp.versionName="0.1.$GITHUB_RUN_NUMBER" \
            --no-configuration-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process
      - name: 校验并收集发布产物
        run: |
          python3 scripts/release.py prepare \
            --apk app/build/outputs/apk/lite/release/app-lite-release.apk \
            --code "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          cp app/build/outputs/mapping/liteRelease/mapping.txt dist/mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zhihu-eink-lite
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          name: zhihu-eink-lite
          path: dist
      - name: 校验并发布本仓库测试版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py publish \
            --code "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
